import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

import * as S2 from './stage2.js';   // 2 面 (宇宙・惑星レース) の計算と表 (9/30)
import * as S3 from './stage3.js';   // 3 面 (神々の世界めぐり) の表・作り手・世界の景色 (10/8)
import { createTalk, preloadVoices } from './talk.js';   // 会話の画面 (導入・面のはじめ・エンディングで共通、10/19)
import * as OP from './opening.js';   // 導入 (天国の会話と 自転の説明、10/19)
import * as RS from './result.js';   // 結果発表の画面 (10/20)
import * as IN from './intros.js';   // 2 面・3 面のはじめ (天国の会話と 3D の説明、10/20)

/* ==================== 調整ノブ ==================== */
/* 単位: 長さは メートル、速さは 秒速 (m/s)。1 単位 = 1 m */
const LANES = 3, LANE_W = 1.6, LANE_W_SKY = 6.0;   // レールの本数と間隔 (m)。空では間隔を広げる (上昇区間でなめらかに 1.6 → 6.0)
const V0 = 1.5;                         // 走り出しの速さ (m/s)
const BOOST_MODE = 'step';              // 加速のしかた。'step' = 踏むごとに +1, +2, +3 … km/h (踏んだ枚数ぶん増える。9/8 社長採用: フルコンボ ≒ X-15) / 'ratio' = +0.8 m/s + いまの速さの 6% (複利)
const STEP_KMH = 1;                     // step 方式の刻み (km/h)。n 枚目で +n km/h (10/26 社長: これで大丈夫。板を 100 枚にする方で 合わせる → 52 枚 = 約半分で 時速 1,360 km、全部で 約 5,150 km)
const BOOST_BASE = 0.8, BOOST_RATE = 0.06;   // ratio 方式の数字
const PLATE_SEC = 2.0, PLATE_SEC1 = 1.8, PLATE_SEC1_START = 2.0, PLATE_GAP1 = 5;   // 加速板・輪の間隔 (秒): 2 面 = 2 秒ごと。1 面 = 走り出し 2 秒 → 時速 60 km で 1.8 秒ごと、最短 5 m (10/26 社長: 1 面を 3 分 23 秒にして 板を 100 枚・走り出しの加速が足りない → 前の 4.5 秒 → 2 秒・最短 8 m では 84 枚で 時速 60 km まで 40 秒、今は 101 枚・25 秒)
const FINISH_LEAD = 5, BLAST_RATE = 3, PLATE_QUIET = 9;   // PLATE_QUIET: FINISH の この秒数前から 加速レーンを新しく置かない (上に伸びる光の柱が 飛び去りの演出を隠すため、9/15 社長)。板は最大 PLATE_AHEAD_SEC (8) 秒先まで置くので、9 秒なら FINISH 時に残る板がなくなる (途中で消すのは不自然 = 社長判断で不採用)。PLATE_AHEAD_SEC は下で定義 (ここでは参照できない)   // 曲の終わりの 5 秒前に FINISH (時速が右中央へ・打ち上げ開始)。曲の最後の「ジャン」で ピカーン + 一気に加速 (毎秒 e^3 倍) して画面の上へ消える
function plateSec(vv){ if(stage!==1) return PLATE_SEC; const e=Math.min(1, Math.max(0, (vv-V0)/(60/3.6-V0))); return PLATE_SEC1_START+(PLATE_SEC1-PLATE_SEC1_START)*e; }   // 走り出し (V0) で 4.5 秒 → 時速 60 km で 2 秒
const PLATE_AHEAD_SEC = 8, PLATE_AHEAD_MIN = 40, PLATE_FIRST = 40;   // 板は おばけの少し先 (この秒数ぶん・最低この距離) に敷いていく。最初の板の位置 (スタート地点 30 m の 10 m 先)
const PLATE_POOL = 64;                  // 板の使い回しの枚数
const MARK_SCALE_V = 50, MARK_SCALE_MAX = 6, BEAM_H = 20;   // 速いほど 加速板/ボックスを大きく (1 + 速さ/50 倍、最大 6 倍)。空では ボックス + 光の柱 (高さ 20 m × 倍率)
const LAUNCH_PITCH = 75*Math.PI/180, LAUNCH_RAMP = 600, LAUNCH_ACC = 40;   // FINISH 後: レールは 600 m かけて 75° まで立ち上がり 宇宙へ。おばけは 毎秒 +40 m/s で飛び去る
const GROW_V = 60/3.6, GHOST_MIN_SCALE = 1.0;    // おばけの大きさは変えない (1.0)。序盤はカメラを低く近く寄せる (下の CAM_*_LOW)。時速 60 km で通常の構図へ
const CAM_BACK_LOW = 5.5, CAM_UP_LOW = 1.7, CAM_AHEAD_LOW = 9, FOV_LOW = 56;   // 序盤 (地面を走る) のカメラ: 目線の高さで近く
const START_S = 30;                     // スタート地点 (コースの先頭から 30 m 先。カメラが後ろに回り込める余地)
const LADDER = [                        // 抜く相手 (本物の速さ、時速 km)。速さがこれを超えたら「ぬいた！」
  {name:'カメ', kmh:1}, {name:'ニワトリ', kmh:14}, {name:'はしる ひと', kmh:20}, {name:'スケートボード', kmh:25}, {name:'じてんしゃ', kmh:30}, {name:'ロバ', kmh:40}, {name:'いぬ', kmh:45}, {name:'キツネ', kmh:50}, {name:'うま', kmh:60}, {name:'シマウマ', kmh:64},
  {name:'オオカミ', kmh:65}, {name:'シカ', kmh:80}, {name:'じどうしゃ', kmh:100}, {name:'ハト', kmh:110}, {name:'でんしゃ', kmh:115}, {name:'チーター', kmh:120}, {name:'ジェットコースター', kmh:150}, {name:'バイク', kmh:160}, {name:'ヘリコプター', kmh:250}, {name:'プロペラき', kmh:300},
  {name:'しんかんせん', kmh:320}, {name:'F1', kmh:370}, {name:'ハヤブサ', kmh:390}, {name:'リニアモーターカー', kmh:600}, {name:'ひこうき', kmh:900}, {name:'ブルーインパルス', kmh:1040}, {name:'おとの はやさ', kmh:1224}, {name:'ちきゅうの じてん', kmh:1360}, {name:'X-1', kmh:1540},   /* X-1 = はじめて 音より速く飛んだ飛行機 (1948 年の 最高 マッハ 1.45)。10/26 社長: 自転の後の 空いた区間を 大きいもので埋める */
  {name:'コンコルド', kmh:2180}, {name:'せんとうき', kmh:2650}, {name:'SR-71', kmh:3540}, {name:'ミサイル', kmh:4000}, {name:'X-15', kmh:7270}, {name:'ロケット', kmh:12000},   // 自転の先: 音速の 2 倍 / 戦闘機 F-15 (マッハ 2.5) / 偵察機 ブラックバード (マッハ 3.3) / マッハ 3 級 / いちばん速い飛行機 / 打ち上げ途中のロケット。9/10 社長: 概念 (月の公転) より 本当に飛んでいるもの
  {name:'だいいち うちゅうそくど', kmh:28440}, {name:'だいに うちゅうそくど', kmh:40320},   // ご褒美 (人工衛星の速さ 7.9 km/s、地球の重力を振り切る 11.2 km/s)。上限なし
].map(o=>({...o, ms:o.kmh/3.6}));
const AIRPLANE_RUNG = LADDER.findIndex(o=>o.name==='ひこうき');   // これを抜いたら コースが空へ上がる
const ROT_RUNG = LADDER.findIndex(o=>o.name==='ちきゅうの じてん'), V_GOAL = LADDER[ROT_RUNG].ms;   // 1 面の目標 = 地球の自転
const STRATO_RUNG = LADDER.findIndex(o=>o.name==='コンコルド');   // これを抜いたら 成層圏へ上り始める (自転を抜いた直後だと コンコルドが見えにくいため)
const V_ORBIT = LADDER.find(o=>o.name==='だいいち うちゅうそくど').ms, V_ESCAPE = LADDER.find(o=>o.name==='だいに うちゅうそくど').ms;
const AHEAD_MAX = 6000;                 // 先を作る距離と 見える距離の天井 (m)。極端な速さでも コースの作りすぎを防ぐ
const CTRL_LEN = 30, SEG_PTS = 8;       // コースの制御点の間隔 (m) と 1 区間で足す点数 (1 区間 = 240 m)
const CLIMB_GRADE = 0.06, ALT_MAX = 600;// 空 (雲の上) での ゆるい上り (6%) と 最高高度 (m)
const STRATO_GRADE = 0.30, ALT_MAX2 = 15000;   // 自転を抜いたら さらに上へ (30% ≒ 17° で上り続ける)。高さは 本物より縮めてある (速さは本物)
const STRATO_ALT = 4000, OZONE_ALT = 7000, SPACE_ALT = 12000;   // ゲーム内の高さの目印: 成層圏の境目 (雲はここまで) / オゾン層の帯の中心 / 空が真っ暗になる高さ
const PLASMA_V = 1700, PLASMA_ALT = 13000;      // 大気の中を これより速く (≒ マッハ 5) 飛ぶと 空気が焼けてプラズマが光る。大気の外 (SPACE_ALT 以上) では消える
const TURN_RATE = 0.095;                // 見た目の曲がる速さ (rad/秒)。速いほどカーブをゆるくして これを一定に保つ (目がちらつかない)
const PLANE_V = LADDER[AIRPLANE_RUNG].ms, PLANE_SPAWN_RATIO = 0.6, PLANE_LEAD = 300;   // 飛行機: 本物の速さ 250 m/s。その 6 割の速さになったら 300 m 先に現れる
const SKY_NEAR = 60;   // 空 (上昇から先) の相手は 板を踏んで速くなるほど 近くで待つ: 相手の 6 割の速さ = lead → 同じ速さ = 機体の後ろの端が この距離 (10/26 社長: 空は 踏んでも 近づかなくて ストレス。地上は これまでどおり)
const CLIMB_LEN = 1500, CLIMB_RISE = 350;   // 見せ場「上昇」区間: 1,500 m かけて 350 m 上がる大きな曲線 (板なし・操作なし)
const CATCHUP_RATE = 1.6, CATCHUP_SEC = 45;  // 曲の最後の曲に入っても飛行機を抜けていなければ 加速 1.6 倍の追い風。残り 45 秒を切ったら 飛行機が少しゆずる
const TIE_GAP = 12;                     // 枕木の間隔 (m)
const CAM_BACK = 7.5, CAM_UP = 3.2, CAM_AHEAD = 14, CAM_SMOOTH = 5;   // 後ろ視点カメラの基本位置 (おばけの後ろ 7.5 m・上 3.2 m・14 m 先を見る)
const CAM_KICK_BACK = 1.8, CAM_KICK_UP = 0.5, CAM_KICK_ADD = 0.5, CAM_KICK_DECAY = 0.7;   // 加速した瞬間に カメラが引く量 (控えめ) と じわっと戻る速さ (1/秒。約 1.4 秒で戻る)
const FOV_MIN = 62, FOV_KICK = 4, FOV_SPEED = 6;   // 視野: 基本 62°、加速の瞬間 +4°、速いほど +6° まで
const LANE_SMOOTH = 7;
/* 2 面 (宇宙・惑星レース、9/30 設計書)。stage = いま遊んでいる面 */
let stage = 1;

    parts.length=0; for(const [mat, geos] of byMat){ const g= geos.length>1 ? mergeGeometries(geos, false) : null; if(g) parts.push({geo:g, mat}); else for(const x of geos) parts.push({geo:x, mat}); }

const rivals=[], rivalByRung={}, announced=[];

const PASS_OVER=new Set(['ブルーインパルス']);   // 追い抜きの見せ方 (9/15 社長: 空に出てからだけ): 編隊は真上 5 m をそのまま飛び おばけが下を潜り抜ける / ほかの飛ぶ相手は 横すれすれ。地上では元の位置のまま   // 追い抜きの見せ方 (9/15 社長: 迫力。空に出てからだけ): 沈む組 = レールの真下へ沈んで おばけに上を抜かせる / 上を飛ぶ組 (編隊) = 真上 5 m をそのまま飛び おばけが下を潜り抜ける / ほかは 横すれすれ。地上では 元の位置のまま
const START_RIVAL_V = 50/3.6;   // この速さ以下の相手 (カメ・ニワトリ・走る人・スケボー・自転車・ロバ・いぬ・キツネ) は スタートと同時に走り出す (運動会のいっせいスタート)
function lineUpStartRivals(){ let k=0; for(const r of rivals){ if(r.fly || r.ms>START_RIVAL_V) continue; r.active=true; r.s= k===0 ? START_S+12 : START_S+3+k*4.5+(k%2===0 ? 2.5 : 0); r.v=V0; r.lane= k%2===0 ? 0 : LANES-1; r.mesh.visible=true; k++; } }   // 先頭 (カメ) はスタートライン (アーチ、+12 m) の真上に (9/12 社長)。同じ車線の次の走者は 2.5 m ずらして重ならないように
const planeRival=rivals.find(r=>r.climbTrigger);
const PF=mkFrame();
function recomputeRung(){   // 速さの段 = 先頭から連続して達成した所まで (姿のある相手は 実際に抜いたか、姿のない相手は 速さで)
  let k=-1; for(let i=0;i<LADDER.length;i++){ const rv=rivalByRung[i]; if(!(rv ? rv.passed : v>=LADDER[i].ms)) break; k=i; }
  if(k!==rung){ rung=k; updateLadderHUD(); }
}
function pickRivalLane(spawnS){   // おばけのレーンと、近くにいる別の相手のレーンを避ける (空きがなければ おばけ以外からランダム)
  const cands=[]; for(let k=0;k<LANES;k++){ if(k===lane) continue; if(rivals.some(o=>o.active && !o.fly && o.lane===k && Math.abs(o.s-spawnS)<60)) continue; cands.push(k); }
  if(!cands.length) for(let k=0;k<LANES;k++) if(k!==lane) cands.push(k);
  return cands[(Math.random()*cands.length)|0];
}
function spawnRival(r){   // 相手は 前方の遠くに現れて 見えてくる (板を踏んで 相手の 6 割の速さになった瞬間)
  r.active=true; r.entering=false; r.s=s+r.lead*1.7; r.v=Math.min(r.ms, v); r.lane=pickRivalLane(r.s); r.mesh.visible=true;   // 「○○が みえてきた！」は 出さない (10/26 社長: 「おいぬいた！」が どんどん出るので 文字で いっぱいになる)
}
function trySpawnRival(force){   // いま出せる相手 (速さが 6 割に達した・まだ出ていない) を 1 体だけ出す
  const r=rivals.find(o=>!o.active && !o.passed && (v>=o.ms*PLANE_SPAWN_RATIO || (force && o.climbTrigger)));
  if(r) spawnRival(r);
}
function updateRivals(dtMove){
  for(let i=0;i<LADDER.length;i++){ if(!rivalByRung[i] && !announced[i] && v>=LADDER[i].ms){ announced[i]=true; if(i<HUD_RUNGS) pop('「'+LADDER[i].name+'」を ぬいた！'); recomputeRung(); } }   // 姿のない相手 (自転など) は 速さで
  if(planeRival && !planeRival.active && !planeRival.passed && songRemaining()<CATCHUP_SEC+15) trySpawnRival(true);   // 飛行機は 曲の終わりが近ければ 速さが足りなくても出す
  const sky= segFor(s).phase!=='ground';
  for(const r of rivals){
    if(!r.active) continue;
    const gap=r.s-s;
    if(!r.passed){
      const p= sky ? Math.min(1, Math.max(0, (v-r.ms*PLANE_SPAWN_RATIO)/(r.ms*(1-PLANE_SPAWN_RATIO)))) : 0, want=r.lead+(Math.min(r.lead, SKY_NEAR+r.len*0.5)-r.lead)*p;   /* 待つ距離 (空だけ 速さが相手に近づくほど 近く) */
      const fk= sky ? 0.8 : 0.1, fc= sky ? 0.15 : 0.08;   /* 待つ距離への 寄り方 (空は 1〜2 秒で寄る = 踏むたびに 20 m ほど近づいて見える。0.1 だと 10 秒かかり 超えた時に まだ 200 m 先だった、Codex 指摘) と 寄る速さの上限 (相手の速さの割合) */
      let tv= v<r.ms ? Math.max(v-Math.max(1, r.ms*fc), Math.min(r.ms, v+(want-gap)*fk)) : sky ? Math.min(r.ms, v-Math.max(1, r.ms*fc)) : r.ms;   // 抜かれる前は 見える距離に付き合う。おばけが相手の速さを超えたら 本物の速さで (空は 約 100 m 先から 相手の 15% ぶん 速く追い抜く = 1〜2 秒)   /* 10/26 に「超えたら 1.5 秒で並ぶ」方式を試したが 社長判断で元に戻した (地上は 一気に まとめて抜けて 楽しくない) */
      if(r.climbTrigger){ const rem=songRemaining(); if(rem<CATCHUP_SEC){ const closing=(gap+20)/Math.max(3, rem-30); tv=Math.min(tv, v-Math.max(8, closing)); } }   // 飛行機: 曲が終わりそうなら ゆずる (残り 30 秒は見せ場に)
      r.v+=(tv-r.v)*Math.min(1, dtMove*2);
      if(!r.met && gap<r.len+8) r.met=true;
      if(gap<=0){ r.passed=true;   /* 真横に並んだ瞬間 (体の真ん中同士) に 抜いた (10/19 社長: 追い越しきって 3 m 先 だと 並走が長い乗り物ほど 何秒も遅れた) */ if(r.i<HUD_RUNGS) pop('「'+r.name+'」を ぬいた！'); recomputeRung(); if(r.climbTrigger) startClimb(s, v); if(r.fly) camKick=Math.min(1, camKick+0.5); }   // 飛ぶ相手を抜いた瞬間は 軽いカメラのキック (9/15)   // 「ならんだ！」「そらへ！」の吹き出しは 9/10 社長判断で廃止 (抜いた！だけで十分)
      r.s+=r.v*dtMove;
    } else { r.v=Math.min(r.ms, v-Math.max(2, v*0.05)); r.s+=r.v*dtMove; }   // 抜かれたあとは おばけより必ず遅く (もう前に出てこない)
    if(r.passed && s-r.s>350){ r.active=false; r.mesh.visible=false; continue; }   // 遠く後ろに消えたら 片づける
    frameAt(r.s, PF);
    let off= r.fly ? r.side : laneOff(r.lane, r.s), up= r.fly ? r.up+Math.sin(bob*0.7)*0.4 : r.up+(r.bounce ? Math.abs(Math.sin(r.s*0.9))*0.06 : 0);   // 飛ぶ相手は 決めた高さ、ほかは自分のレールの上 (動物は軽く跳ねる)
    if(r.fly && PF.p.y>30){ const d=Math.abs(r.s-s+5), k= d>=125 ? 0 : d<=25 ? 1 : 1-(d-25)/100, e=k*k*(3-2*k);   // 距離は 相手を進めた後の位置で取り直す (gap は進める前の値 = Codex 指摘)   // 空 (レールの高さ 30 m 以上) でだけ: すれ違いの位置へ寄る。抜かれる前後 125 m で寄り始め、25 m 以内で完全に。離れたら戻る (9/15 社長: 迫力。地上では変なので出さない)
      const over=PASS_OVER.has(r.name), po= laneX+(over ? 0 : Math.sign(r.side||1)*Math.max(3, r.len*0.12)), pu= over ? 5 : 1.5;   // おばけの車線 (laneX) を基準に: 横すれすれ = 横 3〜5 m・同じ高さ / 上を飛ぶ組 (編隊) = 真上 5 m (空の車線は 6 m 間隔なので コース中央基準だと ぶつかって見える = Codex 指摘)。「下へ沈む」は 9/15 社長判断で廃止 (大きな機体が画面いっぱいに来て カクつく)
      off+=(po-off)*e; up+=(pu-up)*e; }
    r.mesh.position.copy(PF.p).addScaledVector(PF.r, off).addScaledVector(PF.u, up); r.mesh.quaternion.setFromRotationMatrix(basisAt(PF));
    if(r.name==='ブルーインパルス') updateFan(r, gap, dtMove);   // 抜かれる瞬間に扇形に開いて煙 (9/15)
    const rotor=r.mesh.getObjectByName('rotor'); if(rotor) rotor.rotation.y+=dtMove*25; const prop=r.mesh.getObjectByName('prop'); if(prop) prop.rotation.z+=dtMove*40;   // ヘリのローターとプロペラは回る
    if(r.mixer) r.mixer.update(dtMove*Math.min(1.6, Math.max(0.5, r.v/r.ms)));   // 走る動きの速さ = いまの速さ ÷ 本来の速さ (ゆっくり付き合う時は ゆっくり走る)
    if(r.limbs){ const a=Math.sin(r.s*4.5)*0.7; r.limbs[0].rotation.x=a; r.limbs[1].rotation.x=-a; r.limbs[2].rotation.x=-a*0.8; r.limbs[3].rotation.x=a*0.8; }   // 走る人: 歩幅 1.4 m で脚と腕を交互に振る (距離で決めるので 速さに自然に合う)
    if(r.fadeMats){ const target= Math.abs(gap)<r.len*0.5+10 ? 0.22 : 1; for(const mt of r.fadeMats) mt.opacity+=(target-mt.opacity)*Math.min(1, dtMove*6); }   // 並んでいる間 (前後 10 m) は 22% の半透明に、離れたら戻す
  }
}
